name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Find project folder
        id: p
        run: |
          echo "--- files in repo ---"
          find . -not -path './.git/*' -not -path './.git' | head -60
          dir=""
          for f in $(find . -name settings.gradle.kts -not -path './.git/*'); do
            d=$(dirname "$f")
            if [ -f "$d/app/build.gradle.kts" ]; then dir="$d"; break; fi
          done
          echo "PROJECT DIR = '$dir'"
          if [ -z "$dir" ]; then echo "::error::Gradle project not found (settings.gradle.kts and app/build.gradle.kts missing)"; exit 1; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeDock-debug-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
