name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (unzips automatically if only a .zip was uploaded)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "Unzipping $ZIP"
              mkdir -p _src && unzip -q -o "$ZIP" -d _src
            fi
          fi
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$S" ]; then echo "::error::settings.gradle.kts not found"; ls -R | head -50; exit 1; fi
          D=$(dirname "$S")
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project dir: $D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeDock-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: ignore
